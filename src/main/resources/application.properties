# =========================================================
# APPLICATION
# =========================================================

spring.application.name=My_Accountant


# =========================================================
# SERVER - RAILWAY
# =========================================================

server.port=${PORT:8080}


# =========================================================
# DATABASE - RAILWAY POSTGRESQL
# =========================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}


# =========================================================
# SPRING BOOT ADMIN
# =========================================================

# Disable or configure only if you actually run a
# Spring Boot Admin Server.
# spring.boot.admin.client.url=${SPRING_BOOT_ADMIN_URL}


# =========================================================
# ACTUATOR / MANAGEMENT
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

management.info.env.enabled=true


# =========================================================
# LOGGING
# =========================================================

logging.pattern.level=%5p [%X{spring.application.name:-},trace=%X{traceId:-},span=%X{spanId:-}]


